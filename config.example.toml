# Screenshotter Slack bridge — configuration template.
#
# Copy this file to config.toml and edit before running. Pass its path with
# --config (defaults to ./config.toml).
#
# The bridge connects to Slack over Socket Mode (an outbound WebSocket), so the
# screenshotter server it reads from does NOT need to be reachable from the
# public internet — only the bridge needs outbound HTTPS access to Slack.
#
# Each recognised link is stored in Slack — as the preview of a "remote file",
# or as an uploaded file with card_style = "image_upload" — workspace-privately,
# and the link is replaced by a card showing that image. The card links to the
# screenshot's page on screenshotter_base_url, which only people who can reach
# your server can open.

# ---------------------------------------------------------------------------
# Screenshotter server
# ---------------------------------------------------------------------------

# Canonical base URL of the screenshotter server (no trailing slash):
# <base_url>/<id> becomes the card's click-through target, and the bridge
# fetches <base_url>/<id>.png from here unless screenshotter_fetch_base_url
# below says otherwise. The posted link only supplies the image ID. Slack never
# fetches this URL itself, so it may be a private address (e.g. on your
# tailnet). Required.
screenshotter_base_url = "http://screenshotter.internal:8080"

# Base URL the bridge itself uses to reach the server (no trailing slash), when
# that differs from the address readers click through to. Typically a Kubernetes
# deployment, where the bridge talks to the server on its in-cluster Service
# while screenshotter_base_url stays the address people open in their browser.
# Default: unset, i.e. fetch from screenshotter_base_url.
#screenshotter_fetch_base_url = "http://screenshotter.default.svc"

# Hostnames that, when posted in Slack, this bridge should unfurl. These must
# match the "App unfurl domains" registered in your Slack app AND the hostnames
# used in your screen/{id} links. Matching is case-insensitive. You can list
# several. A bare single-label host like "screen" works too (confirmed) — the
# image is loaded from screenshotter_base_url, not the link host — as long as the
# posted link carries an explicit scheme (e.g. "http://screen/abcdef"); a
# scheme-less "screen/abcdef" won't be linkified by Slack.
# Any single-segment path on these hosts is treated as an image ID, except known
# server endpoints (see excluded_paths below). The link may omit the .png suffix.
unfurl_domains = ["screen.corp.example"]

# The card's title is the screenshot's title when the server sends the
# X-Screenshot-Title header on the image response, otherwise the page it was
# captured from (X-Screenshot-Source-Url), otherwise "Screenshot <id>". The
# source URL is also stored as the file's indexable contents, since the card has
# no room to show it separately. The card carries no buttons, so Interactivity is
# not needed.

# ---------------------------------------------------------------------------
# Slack credentials
# ---------------------------------------------------------------------------
# Prefer the *_env_var forms so secrets are not written to disk. Set either the
# inline value OR the env var for each token, not both.

# Bot token (xoxb-...). Created when you install the app to your workspace.
# bot_token = "xoxb-..."
bot_token_env_var = "SLACK_BOT_TOKEN"

# App-level token (xapp-...) with the connections:write scope, used for Socket
# Mode. Created under "Basic Information > App-Level Tokens".
# app_token = "xapp-..."
app_token_env_var = "SLACK_APP_TOKEN"

# ---------------------------------------------------------------------------
# Image handling
# ---------------------------------------------------------------------------

# Cap the largest side (width or height) of the preview image, in pixels. Larger
# screenshots are downscaled to it (aspect ratio preserved), which bounds upload
# size and latency; the card links through to the full-resolution image, so the
# preview does not need to be pixel-exact. Set 0 to send previews at full
# resolution. Must be 0 or at least 300 — Slack rejects a preview whose width or
# height is under 300 px. Default: 1600, or 0 (full resolution) with
# card_style = "image_upload". A remote file is never shown more than 1024 px
# wide, so a larger value only helps "image_upload".
# max_dimension = 1600

# Slack parses the preview image asynchronously and files.remote.add returns
# before it is ready (about 2s in practice). The bridge polls until the preview
# is ready, up to this long, and then unfurls regardless. Unfurling early is not
# an error — Slack fills the card in by itself — but the screenshot then takes
# much longer to appear (~12s observed, against ~3s when the bridge waits).
# Set "0s" to unfurl immediately and skip the polling (and the
# remote_files:read scope). Unused by card_style = "image_upload", which always
# waits, up to 15s: Slack refuses to unfurl an upload it has not processed yet.
# Default: 8s.
# preview_wait = "8s"

# ---------------------------------------------------------------------------
# Card appearance
# ---------------------------------------------------------------------------

# How the card presents the screenshot, and how the screenshot is stored in
# Slack.
#  - "image_upload" (recommended): the same card as "image", but the screenshot
#    is uploaded to Slack as a regular file instead of a remote file's preview.
#    Slack shows a remote file at most 1024 px wide, so "image" looks blurry on
#    high-density (Retina) screens; an upload is shown, and opens in Slack's
#    viewer, at full resolution. In exchange:
#      - the app needs the files:write and files:read scopes (instead of
#        remote_files:write and remote_files:read), and Slack must be
#        reinstalled into the workspace after adding them;
#      - every share uploads its own copy, which counts towards the workspace's
#        file storage and appears in the conversation's file list and in
#        search for its members; a copy the bridge replaces (the screenshot
#        changed on the server) is deleted;
#      - the bridge also sends images to files.slack.com, which a firewall must
#        allow.
#    Not the default only because it needs those extra scopes.
#  - "image": the whole preview, uncropped, under the title, with a footer line
#    (card_favicon_url, then card_caption and card_source_caption) linking to
#    the screenshot's page and to the page it was taken from. Slack
#    keeps a coloured bar down the card's left edge, which cannot be removed
#    for this style. It relies on Slack drawing a remote file in an image
#    block, which works but which Slack does not document.
#  - "file": Slack's own file card, with a file icon, the title and "PNG" above
#    the preview, which Slack crops to the card's shape; the whole card links to
#    the screenshot's page.
# In every style Slack adds its usual row with the file size and a collapse
# toggle. Default: "image".
# card_style = "image"

# Icon shown at the start of the image card's footer. Slack's servers fetch it
# when rendering the card, so it must be a public http(s) URL: a server that is
# only reachable on your network cannot provide it, and the icon would render as
# a blank space. If your server is publicly reachable, its own icon is at
# <screenshotter_base_url>/assets/icon-64.png. Set "" for no icon. Unused by the
# "file" style. Default: "https://www.screenshotter.org/favicon-32x32.png".
# card_favicon_url = "https://www.screenshotter.org/favicon-32x32.png"

# Text of the image card's footer link to the screenshot's page. At most 150
# characters; "" removes the link. Unused by the "file" style.
# Default: "Open in Screenshotter".
# card_caption = "Open in Screenshotter"

# Text of the image card's footer link to the page the screenshot was taken
# from, shown when the server knows that page. At most 150 characters; ""
# removes the link. With both captions empty the card has no footer (and no
# icon). Unused by the "file" style. Default: "Open source page".
# card_source_caption = "Open source page"

# Longest card title, in characters; longer titles are cut after that many and
# followed by "…". Applies to every style. Between 1 and 250. Default: 90.
# card_title_max_length = 90

# ---------------------------------------------------------------------------
# Limits (resource / abuse protection)
# ---------------------------------------------------------------------------

# Timeout applied to each outbound request: fetching an image AND each Slack API
# call (file uploads, remote file add/info, unfurl, user/usergroup lookups).
# Default: 30s.
# request_timeout = "30s"

# Maximum number of link_shared events handled in parallel (the network/Slack
# work). Events beyond this are dropped rather than queued, so handler goroutines
# can't pile up unbounded under a flood. Default: 50.
# max_concurrency = 50

# Maximum number of images decoded/rescaled in parallel. Image conversion is the
# memory-heavy step (a decoded image is much larger than its PNG), so it is
# bounded separately from — and more tightly than — max_concurrency. Default: 4.
# max_image_workers = 4

# Maximum number of screenshot links rendered from a single Slack message,
# limiting amplification from one post. Slack itself unfurls at most 5 links per
# message, so raising this above 5 has no effect. Default: 5.
# max_links_per_message = 5

# Additional first path segments to never treat as image IDs, on top of the
# built-in list of known server endpoints (upload, assets, static, thumb, admin,
# auth, favicon.ico). Matched case-insensitively.
# excluded_paths = []

# ---------------------------------------------------------------------------
# User restrictions (optional)
# ---------------------------------------------------------------------------
# By default the bridge renders screenshots for anyone who can post in a channel
# it is in. The options below narrow that. Both fail closed: if Slack cannot be
# queried to evaluate the rule, the share is ignored.

# Ignore link_shared events from users external to the workspace: Slack Connect
# strangers, users from a different team, and guests (single/multi-channel).
# Requires the users:read bot scope. Default: false.
# block_external_users = false

# Restrict rendering to members of these Slack user groups (by group ID, e.g.
# "S0123ABCD"). Empty means no group restriction. Requires the usergroups:read
# bot scope. Default: [].
# allowed_usergroups = []

# ---------------------------------------------------------------------------
# Debugging
# ---------------------------------------------------------------------------

# Verbose logging of the Socket Mode connection and Slack API calls.
# WARNING: debug output can include the bot token and other sensitive data — do
# not enable it in production. Default: false.
# debug = false
